<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e40af" />
<title>404 · xzd1314.top</title>
<meta name="description" content="这一页走丢了 —— 但没关系。xzd1314 的个人主页里还有很多有趣的东西。" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/assets/ui-upgrade.css" />
<style>
  :root{
    --brand:#2b5cff; --brand-2:#06b6d4; --brand-soft:rgba(43,92,255,.10); --brand-ring:rgba(43,92,255,.35);
    --bg:#fbfbfd; --surface-1:#ffffff; --surface-2:#f5f6f9; --surface-3:#eceef3;
    --text-1:#0b1020; --text-2:#4a5266; --text-3:#7b8296;
    --hairline:rgba(17,24,39,.08); --hairline-strong:rgba(17,24,39,.16);
    --glass-edge:inset 0 1px 0 rgba(255,255,255,.9);
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --e1:0 1px 2px rgba(16,24,40,.06);
    --e3:0 12px 28px -8px rgba(16,24,40,.16),0 4px 10px -4px rgba(16,24,40,.08);
    --mono:'Cascadia Mono','Cascadia Code','Consolas','JetBrains Mono',ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--text-1); line-height:1.7;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(24px,5vw,64px) clamp(16px,4vw,40px);
    overflow:hidden; position:relative;
  }
  body::before{
    content:''; position:absolute; inset:-30%;
    background:radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--brand) 14%, transparent), transparent 50%),
               radial-gradient(circle at 70% 80%, color-mix(in srgb, var(--brand-2) 14%, transparent), transparent 50%);
    z-index:-1; pointer-events:none;
  }
  body[data-theme="dark"]{
    --bg:#07080d; --surface-1:#0d0f17; --surface-2:#141824; --surface-3:#1c2231;
    --text-1:#f2f4fa; --text-2:#a8b0c4; --text-3:#6f7789;
    --hairline:rgba(255,255,255,.09); --hairline-strong:rgba(255,255,255,.18);
    --glass-edge:inset 0 1px 0 rgba(255,255,255,.07);
    --e1:0 24px 56px -12px rgba(0,0,0,.72),0 8px 20px -8px rgba(0,0,0,.50);
    background:var(--bg);
  }
  body[data-theme="dark"]::before{
    background:radial-gradient(circle at 30% 20%, rgba(139,92,246,.15), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(34,211,238,.12), transparent 50%);
  }

  .frame{
    width:100%; max-width:520px;
    padding:clamp(32px,5vw,48px) clamp(24px,4vw,40px);
    border-radius:var(--r-lg);
    background:color-mix(in srgb, var(--surface-1) 48%, transparent);
    -webkit-backdrop-filter:blur(24px) saturate(190%);
    backdrop-filter:blur(24px) saturate(190%);
    border:1px solid var(--hairline);
    box-shadow:var(--e1),var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.6);
    text-align:center;
    animation:floatIn .7s var(--ease-out, cubic-bezier(.22,1,.36,1)) both;
  }
  @keyframes floatIn{
    from{opacity:0; transform:translateY(20px) scale(.985)}
    to{opacity:1; transform:none}
  }

  .glyph{
    width:96px; height:96px; margin:0 auto 24px;
    border-radius:24px;
    background:linear-gradient(135deg, var(--brand), var(--brand-2));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px var(--brand-ring), inset 0 1px 0 rgba(255,255,255,.3);
    position:relative;
  }
  .glyph::after{
    content:''; position:absolute; inset:-4px;
    border-radius:26px;
    background:conic-gradient(from 0deg, transparent 0 75%, var(--brand) 88%, var(--brand-2) 96%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:spin 4s linear infinite;
    padding:2px;
  }
  @keyframes spin{to{transform:rotate(1turn)}}
  .glyph svg{width:48px; height:48px; color:#fff}

  .code{
    font-family:var(--mono);
    font-style:italic;
    font-weight:800;
    font-size:clamp(64px,14vw,112px);
    line-height:1;
    letter-spacing:-.05em;
    background:linear-gradient(135deg, var(--brand), var(--brand-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:12px;
  }

  h1{
    font-size:clamp(20px,3vw,24px);
    font-weight:800;
    letter-spacing:-.02em;
    margin-bottom:8px;
    color:var(--text-1);
  }
  p{ font-size:15px; color:var(--text-2); margin-bottom:24px; max-width:36ch; margin-inline:auto }

  .btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 22px; border-radius:var(--r-pill);
    font-size:14px; font-weight:600; font-family:inherit;
    cursor:pointer; border:1px solid var(--hairline);
    background:var(--surface-1); color:var(--text-1);
    transition:transform var(--dur-1,120ms) var(--ease-out, cubic-bezier(.22,1,.36,1)),
               box-shadow var(--dur-2,200ms) var(--ease-out, cubic-bezier(.22,1,.36,1)),
               background var(--dur-2,200ms) var(--ease-out, cubic-bezier(.22,1,.36,1));
    text-decoration:none;
  }
  .btn:hover{ transform:translateY(-1.5px); box-shadow:0 2px 6px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.05) }
  .btn:active{ transform:translateY(0) scale(.97) }
  .btn:focus-visible{ outline:2px solid var(--brand); outline-offset:3px }
  .btn-primary{
    border:none; color:#fff;
    background-image:linear-gradient(135deg,var(--brand),var(--brand-2));
    background-size:180% 100%;
    box-shadow:0 4px 16px var(--brand-ring);
  }
  .btn-primary:hover{ background-position:100% 0; box-shadow:0 8px 26px var(--brand-ring) }

  .hint{
    margin-top:24px; font-size:12px; color:var(--text-3);
    letter-spacing:.04em;
  }
  .hint kbd{
    font-family:var(--mono); font-size:11px;
    padding:2px 7px; border-radius:5px;
    background:var(--surface-3); color:var(--text-2);
    border:1px solid var(--hairline);
  }

  ::selection{ background:color-mix(in srgb, var(--brand) 22%, transparent); color:var(--text-1); }
</style>
</head>
<body>
  <main class="frame">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 10h.01M16 10h.01"/>
        <path d="M9 16h6"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1 class="zh">这一页走丢了</h1>
    <h1 class="en" style="display:none">This page is lost</h1>
    <p class="zh">不过没关系 —— 主页面里还有更多有趣的东西。</p>
    <p class="en" style="display:none">No worries — there's plenty more on the main page.</p>

    <div class="btns">
      <a class="btn btn-primary" href="/">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        <span class="zh">回首页</span><span class="en" style="display:none">Home</span>
      </a>
      <button class="btn" id="randomBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.5-7.1"/><path d="M21 4v5h-5"/></svg>
        <span class="zh">随便看看</span><span class="en" style="display:none">Surprise me</span>
      </button>
    </div>

    <p class="hint">
      <span class="zh">顺便说一句，按 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> 刷新缓存</span>
      <span class="en" style="display:none">Try <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> to bypass cache</span>
    </p>
  </main>

  <script>
  // theme: 跟随主站点偏好
  try{
    var t = localStorage.getItem('site_theme');
    if(t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
      document.body.setAttribute('data-theme','dark');
    }
    var lang = (localStorage.getItem('site_lang')==='en') ? 'en' : 'zh';
    document.querySelectorAll('.'+lang).forEach(function(el){ el.style.display=''; });
    document.querySelectorAll('.zh,.en').forEach(function(el){
      if(el.classList.contains(lang)) return;
      el.style.display='none';
    });
  }catch(e){}

  // 彩蛋：连点 6 次右上角的小图标也能触发主站彩蛋
  var glyph=document.querySelector('.glyph');
  var count=0, timer=null;
  glyph.addEventListener('click',function(){
    count++; clearTimeout(timer);
    timer=setTimeout(function(){count=0;},3000);
    if(count>=6){
      count=0;
      // 用 emoji 烟花简单庆祝一下
      var burst=document.createElement('div');
      burst.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;z-index:9999;pointer-events:none;';
      burst.textContent='🎉';
      document.body.appendChild(burst);
      burst.animate([{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.5)'}],{duration:900,easing:'cubic-bezier(.22,1,.36,1)'});
      setTimeout(function(){burst.remove();},900);
    }
  });

  // 随便看看：跳到随机项目
  document.getElementById('randomBtn').addEventListener('click',function(){
    var links=['/#hero','/#about','/#skills','/#projects','/#contact','/#stats','/#links'];
    var next=links[Math.floor(Math.random()*links.length)];
    location.href=next;
  });

  // Konami 在 404 也保留
  (function(){
    var seq=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA','KeyB','KeyA'];
    var i=0;
    document.addEventListener('keydown',function(e){
      if(e.code===seq[i]){i++;if(i===seq.length){i=0;location.href='/?weird=1';}}
      else{i=(e.code===seq[0])?1:0;}
    });
  })();
  </script>
</body>
</html>
