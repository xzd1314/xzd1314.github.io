<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 Not Found</title>
<style>
  html,body{height:100%}
  body{
    margin:0;background:#fff;color:#000;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.6;
  }
  .center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;max-width:90vw;
  }
  h1{
    font-size:22px;font-weight:400;margin:0 0 14px;letter-spacing:.2px;
  }
  hr{
    border:0;border-top:1px solid #ccc;width:220px;margin:0 auto 14px;
  }
  .sig{
    font-family:Consolas,"Courier New",monospace;font-size:14px;color:#333;
  }
  .back{
    display:inline-block;margin-top:28px;font-size:12px;color:#999;text-decoration:none;
  }
  .back:hover{color:#666;text-decoration:underline}
  @media (prefers-color-scheme: dark){
    body{background:#0e0e0e;color:#e6e6e6}
    hr{border-top-color:#3a3a3a}
    .sig{color:#bbb}
    .back{color:#666}
  }
</style>
</head>
<body>
  <div class="center">
    <h1>404 Not Found</h1>
    <hr>
    <div class="sig">nginx</div>
    <a class="back" href="/">← 回到首页</a>
  </div>
</body>
</html>
