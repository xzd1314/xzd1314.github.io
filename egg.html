<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>和 Deepseek 的对话</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --primary:#8B5000; --on-primary:#fff;
  --primary-container:#FFDCBE; --on-primary-container:#2D1600;
  --secondary-container:#FCDEBC; --on-secondary-container:#281806;
  --surface:#FFF8F5; --on-surface:#221A12;
  --surface-container-low:#FFF2EA; --surface-container:#F9E9DE; --surface-container-high:#F3E3D8;
  --on-surface-variant:#52443A; --outline-variant:#D7C3B5;
  --font:"Roboto","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
}
[data-theme="dark"]{
  --primary:#FFB86B; --on-primary:#4A2800;
  --primary-container:#6A3C00; --on-primary-container:#FFDCBE;
  --secondary-container:#57442B; --on-secondary-container:#FCDEBC;
  --surface:#191210; --on-surface:#EFE0D6;
  --surface-container-low:#221A16; --surface-container:#261E1A; --surface-container-high:#312823;
  --on-surface-variant:#D7C3B5; --outline-variant:#52443A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--surface);color:var(--on-surface);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:
    radial-gradient(45vmax 45vmax at 15% 10%, var(--primary-container), transparent 62%),
    radial-gradient(40vmax 40vmax at 90% 80%, var(--secondary-container), transparent 60%);
  opacity:.75;
}
header{
  height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(255,248,245,.82);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--outline-variant);
}
[data-theme="dark"] header{background:rgba(25,18,16,.82)}
.back{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-variant);
  display:grid;place-items:center;cursor:pointer;transition:background .25s var(--ease);text-decoration:none}
.back:hover{background:rgba(120,90,60,.12)}
.back svg{width:22px;height:22px;fill:currentColor}
.who{display:flex;align-items:center;gap:10px;flex:1}
.ava{width:38px;height:38px;border-radius:50%;background:transparent;flex:none;
  display:grid;place-items:center;
  -webkit-user-select:none;user-select:none;cursor:pointer;
  transition:transform .15s var(--ease)}
.ava img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(77,107,254,.35))}
.meta .n{font-size:15px;font-weight:600;line-height:18px}
.meta .s{font-size:11.5px;color:var(--on-surface-variant);display:flex;align-items:center;gap:5px}
.meta .s i{width:6px;height:6px;border-radius:50%;background:#3fbf6a;display:inline-block;box-shadow:0 0 6px #3fbf6a}

.chat{flex:1;overflow-y:auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px;
  max-width:720px;width:100%;margin:0 auto}
.row{display:flex;gap:10px;align-items:flex-end;opacity:0;transform:translateY(12px);
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.row.show{opacity:1;transform:none}
.row.me{flex-direction:row-reverse}
@keyframes in{to{opacity:1;transform:none}}
.bubble{
  max-width:min(78%,520px);padding:11px 15px;border-radius:18px;font-size:15px;line-height:23px;
  background:var(--surface-container-high);color:var(--on-surface);
  border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);word-break:break-word;
}
.row.me .bubble{background:var(--primary-container);color:var(--on-primary-container);
  border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.pic{padding:8px;background:var(--surface-container-high);border-radius:18px;border-bottom-left-radius:6px;
  box-shadow:0 6px 20px -8px rgba(0,0,0,.35);max-width:min(78%,340px)}
.pic img{display:block;width:100%;border-radius:12px}
.pic .cap{font-size:12.5px;color:var(--on-surface-variant);padding:8px 6px 2px;text-align:center}

.typing{display:flex;gap:5px;padding:14px 16px;background:var(--surface-container-high);border-radius:18px;
  border-bottom-left-radius:6px;width:fit-content}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--on-surface-variant);opacity:.55;
  animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

footer{flex:none;padding:10px 16px 18px;text-align:center;font-size:12px;color:var(--on-surface-variant);opacity:.8}
footer a{color:var(--primary);text-decoration:none}
@media (prefers-reduced-motion: reduce){
  .row{animation:none;opacity:1;transform:none}
  .typing i{animation:none}
}
</style>
</head>
<body>

<header>
  <a class="back" data-link="/" role="link" tabindex="0" aria-label="返回">
    <svg viewBox="0 0 24 24"><path d="M15.5 3.5 7 12l8.5 8.5 1.4-1.4L9.8 12l7.1-7.1z"/></svg>
  </a>
  <div class="who">
    <div class="ava"><img src="/assets/deepseek.svg" alt="Deepseek"></div>
    <div class="meta">
      <div class="n">Deepseek</div>
      <div class="s"><i></i>在线</div>
    </div>
  </div>
</header>

<div class="chat" id="chat">
  <div class="row me" id="meRow">
    <div class="bubble">你这个做的什么网站，怎么那么烂？！</div>
  </div>

  <div class="row" id="typingRow">
    <div class="typing"><i></i><i></i><i></i></div>
  </div>

  <div class="row" id="replyRow" style="display:none">
    <div class="pic">
      <img src="/assets/egg.jpg" alt="小d" loading="eager">
      <div class="cap">……压力一只蓝色大肥鱼？</div>
    </div>
  </div>

  <div class="row" id="afterRow" style="display:none">
    <div class="bubble">行吧，你说哪里烂，我改。</div>
  </div>
</div>

<footer>这是彩蛋 · <a data-link="/" role="link" tabindex="0">回首页</a></footer>

<script>
(function(){
  var root=document.documentElement;
  var t=localStorage.getItem('theme');
  var prefers=matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', t || (prefers?'dark':'light'));

  var chat=document.getElementById('chat');
  var meRow=document.getElementById('meRow');
  var typing=document.getElementById('typingRow');
  var reply=document.getElementById('replyRow');
  var after=document.getElementById('afterRow');

  setTimeout(function(){ meRow.classList.add('show'); }, 120);
  setTimeout(function(){ typing.classList.add('show'); }, 420);

  setTimeout(function(){
    typing.style.display='none';
    reply.style.display='flex';
    requestAnimationFrame(function(){ reply.classList.add('show'); });
    chat.scrollTop=chat.scrollHeight;
  }, 1900);

  setTimeout(function(){
    after.style.display='flex';
    requestAnimationFrame(function(){ after.classList.add('show'); });
    chat.scrollTop=chat.scrollHeight;
  }, 2900);


  document.querySelectorAll('[data-link]').forEach(function(a){
    var href=a.getAttribute('data-link');
    a.addEventListener('click',function(e){ e.preventDefault(); location.href=href; });
    a.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); location.href=href; } });
  });

  /* 再点三次头像 → 回去 */
  var ava=document.querySelector('.ava'), n=0, timer=null;
  ava.addEventListener('click',function(){
    n++;
    clearTimeout(timer);
    timer=setTimeout(function(){ n=0; }, 900);
    ava.style.transform='scale(.92)';
    setTimeout(function(){ ava.style.transform=''; }, 120);
    if(n>=3){ location.href='/'; }
  });
})();
</script>
</body>
</html>
