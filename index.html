<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>验证中... | xzd1314</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    body{
      background:#000;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      overflow:hidden;
      position:relative;
    }
    body::before{
      content:'';
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(249,115,22,0.08) 0%,transparent 60%);
      pointer-events:none;
    }
    .verify-container{
      text-align:center;
      z-index:1;
      padding:20px;
      max-width:420px;
      width:100%;
    }
    .logo-wrap{
      width:72px;height:72px;
      margin:0 auto 28px;
      border-radius:50%;
      background:linear-gradient(135deg,#f97316,#ea580c);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 32px rgba(249,115,22,0.3);
      animation:pulse 2s ease-in-out infinite;
    }
    .logo-wrap svg{width:36px;height:36px;color:#fff}
    @keyframes pulse{
      0%,100%{box-shadow:0 8px 32px rgba(249,115,22,0.3)}
      50%{box-shadow:0 8px 48px rgba(249,115,22,0.5)}
    }
    h1{
      font-size:24px;font-weight:700;
      margin-bottom:10px;
      letter-spacing:-0.01em;
    }
    .subtitle{
      font-size:14px;color:#888;
      margin-bottom:32px;
      line-height:1.6;
    }
    .turnstile-wrap{
      display:flex;justify-content:center;
      margin-bottom:28px;
      min-height:65px;
    }
    .divider{
      width:40px;height:1px;
      background:#333;
      margin:0 auto 20px;
    }
    .footer-text{
      font-size:11px;color:#555;
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .footer-text svg{width:12px;height:12px}
    .loading-dots{display:inline-flex;gap:3px;margin-left:4px}
    .loading-dots span{
      width:4px;height:4px;border-radius:50%;
      background:#666;animation:dotPulse 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2){animation-delay:.2s}
    .loading-dots span:nth-child(3){animation-delay:.4s}
    @keyframes dotPulse{
      0%,80%,100%{opacity:.3}
      40%{opacity:1}
    }
    .success-state{display:none}
    .success-state.show{display:block}
    .verify-state.hide{display:none}
    .check-icon{
      width:56px;height:56px;margin:0 auto 20px;
      border-radius:50%;background:#22c55e;
      display:flex;align-items:center;justify-content:center;
      animation:scaleIn .4s ease;
    }
    .check-icon svg{width:28px;height:28px;color:#fff}
    @keyframes scaleIn{
      from{transform:scale(0);opacity:0}
      to{transform:scale(1);opacity:1}
    }
    .redirect-text{font-size:15px;color:#aaa;margin-top:8px}
    .redirect-text strong{color:#fff}
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-state" id="verifyState">
      <div class="logo-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>正在验证<span class="loading-dots"><span></span><span></span><span></span></span></h1>
      <p class="subtitle">请完成下方的人机验证以继续访问<br/>xzd1314.github.io</p>
      <div class="turnstile-wrap">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEYslAufS7xZQ-Jn" data-callback="onVerifySuccess" data-theme="dark"></div>
      </div>
      <div class="divider"></div>
      <p class="footer-text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        由 Cloudflare Turnstile 提供安全验证
      </p>
    </div>
    <div class="success-state" id="successState">
      <div class="check-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h1>验证成功</h1>
      <p class="redirect-text">正在跳转到网站<strong id="countdown">3</strong>秒...</p>
    </div>
  </div>

  <script>
    // Allow search engine crawlers to bypass verification
    (function(){
      var ua=navigator.userAgent.toLowerCase();
      var bots=['bingbot','bingpreview','googlebot','google-inspectiontool','google-extended','baiduspider','yandexbot','duckduckbot','slurp','msnbot','facebookexternalhit','twitterbot','applebot','semrushbot','ahrefsbot','mj12bot','petalbot','bytespider'];
      for(var i=0;i<bots.length;i++){if(ua.indexOf(bots[i])!==-1){window.location.replace('home.html');return;}}
    })();
    function onVerifySuccess(token){
      document.getElementById('verifyState').classList.add('hide');
      document.getElementById('successState').classList.add('show');
      var count=3;
      var el=document.getElementById('countdown');
      var timer=setInterval(function(){
        count--;
        if(el)el.textContent=count;
        if(count<=0){clearInterval(timer);window.location.href='home.html';}
      },1000);
      setTimeout(function(){window.location.href='home.html';},3200);
    }
  </script>
</body>
</html>
