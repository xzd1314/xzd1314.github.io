<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c1219">
<title>UEG 行政管理中心 | 地球联合政府 · 行政总署</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
/* ===== 自定义字体 ===== */
@font-face{font-family:'UEG-Body';src:url('/fonts/zhonghei.ttf') format('truetype');font-weight:400 700;font-display:swap}
@font-face{font-family:'Rajdhani';src:url('/fonts/rajdhani-medium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'DIN';src:url('/fonts/din-mittelschrift.otf') format('opentype');font-weight:500;font-display:swap}

:root{
  /* 全新配色：深炭灰 + 冰蓝 + 琥珀橙 */
  --bg-0:#0c1219;--bg-1:#111820;--bg-2:#161e28;
  --surface:rgba(17,24,32,0.82);--surface-solid:#111820;--surface-2:#1a2430;
  --border:rgba(56,189,248,0.14);--border-strong:rgba(56,189,248,0.28);
  --text:#e2e8f0;--text-muted:#94a3b8;--text-faint:#5a6a7a;
  --ice:#38bdf8;--ice-bright:#7dd3fc;--ice-dim:#0ea5e9;
  --amber:#f97316;--amber-bright:#fb923c;--amber-dim:#ea580c;
  --green:#22c55e;--red:#ef4444;
  --radius:6px;--radius-sm:4px;--radius-lg:10px;
  --shadow-card:0 20px 50px -20px rgba(0,0,0,0.8);
  --shadow-soft:0 8px 24px -12px rgba(0,0,0,0.6);
  --font-zh:'UEG-Body','Microsoft YaHei','PingFang SC',sans-serif;
  --font-en:'Rajdhani','UEG-Body',sans-serif;
  --font-din:'DIN','Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg-0);color:var(--text);font-family:var(--font-zh);
  font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
#root{min-height:100vh}
::selection{background:rgba(56,189,248,0.3);color:#fff}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,0.2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,0.4)}
.mono{font-family:var(--font-en)}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1}

/* ===== 登录页 ===== */
.login-wrap{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;position:relative;overflow:hidden;
}
.bg-photo{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-size:cover;background-position:center;
  background-image:url('/img/bg-engine-wide.jpg');
}
.bg-photo::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(12,18,25,0.88),rgba(12,18,25,0.6) 40%,rgba(12,18,25,0.92));
}
.bg-vignette{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 50%,transparent 30%,rgba(12,18,25,0.7) 100%);
}
.login-wrap>*:not(.bg-photo):not(.bg-vignette){position:relative;z-index:1}

.login-header{
  margin-bottom:24px;text-align:center;color:var(--text-muted);
  font-family:var(--font-en);letter-spacing:0.28em;font-size:10px;text-transform:uppercase;
}
.login-card{
  width:100%;max-width:400px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:36px 32px 28px;
  box-shadow:var(--shadow-card);backdrop-filter:blur(20px);
  position:relative;overflow:hidden;
  animation:cardIn 0.6s cubic-bezier(0.22,1,0.36,1);
}
@keyframes cardIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--ice),transparent);
}
.login-card::after{
  content:'';position:absolute;top:8px;left:8px;width:16px;height:16px;
  border-top:2px solid var(--ice);border-left:2px solid var(--ice);opacity:0.5;
}
.login-head{text-align:center;margin-bottom:8px}
.login-head .ueg-logo{
  height:80px;display:block;margin:0 auto 10px;
  filter:drop-shadow(0 0 12px rgba(56,189,248,0.3));
}
.login-head h1{
  font-family:var(--font-zh);font-size:26px;font-weight:700;letter-spacing:0.14em;color:var(--text);
}
.login-head .sub{
  font-family:var(--font-en);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--ice);margin-top:6px;
}
.officer-row{display:flex;flex-direction:column;align-items:center;margin-top:16px}
.officer-avatar{
  width:60px;height:60px;border-radius:50%;border:2px solid var(--ice);
  padding:2px;box-shadow:0 0 20px rgba(56,189,248,0.25);object-fit:cover;
}
.officer-name{margin-top:8px;font-size:14px;font-weight:600;color:var(--text)}
.officer-tag{
  font-family:var(--font-en);font-size:10px;letter-spacing:0.18em;color:var(--ice);
  margin-top:2px;text-transform:uppercase;
}
.login-sep{
  height:1px;background:linear-gradient(90deg,transparent,var(--border-strong),transparent);
  margin:6px 0 22px;
}
.login-error{
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;
  font-size:12.5px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:14px;
  animation:shake 0.4s;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.field{margin-bottom:16px}
.field label{
  display:block;font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:500;
  font-family:var(--font-en);letter-spacing:0.1em;text-transform:uppercase;
}
.field input,.field select,.field textarea{
  width:100%;background:rgba(12,18,25,0.7);border:1px solid var(--border-strong);
  color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;
  font-family:var(--font-zh);outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.field input:focus,.field select:focus{
  border-color:var(--ice);box-shadow:0 0 0 3px rgba(56,189,248,0.12);
}
.field input::placeholder{color:var(--text-faint)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.4);
  color:var(--ice-bright);font-size:13px;padding:8px 16px;border-radius:var(--radius-sm);
  cursor:pointer;font-family:var(--font-zh);transition:all 0.2s;font-weight:500;
}
.btn:hover{background:rgba(56,189,248,0.18);border-color:rgba(56,189,248,0.6)}
.btn.primary{
  background:linear-gradient(135deg,var(--ice),var(--ice-dim));color:#0c1219;
  font-weight:700;border-color:transparent;box-shadow:0 6px 20px -6px rgba(56,189,248,0.5);
  letter-spacing:0.08em;
}
.btn.primary:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(56,189,248,0.6)}
.btn.amber{
  background:linear-gradient(135deg,var(--amber),var(--amber-dim));color:#0c1219;
  font-weight:700;border-color:transparent;
}
.btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text-muted)}
.btn.ghost:hover{border-color:var(--ice);color:var(--ice-bright)}
.btn.sm{padding:5px 11px;font-size:11.5px}
.login-btn{width:100%;justify-content:center;padding:12px;font-size:14px;letter-spacing:0.14em;margin-top:4px}
.login-foot{
  text-align:center;font-family:var(--font-en);font-size:9px;letter-spacing:0.18em;
  color:var(--text-faint);margin-top:22px;text-transform:uppercase;
}
.login-tip{
  margin-top:18px;font-size:11.5px;color:var(--text-muted);text-align:center;line-height:1.8;
  border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px;
  background:rgba(56,189,248,0.03);
}
.login-tip b{color:var(--ice-bright);font-family:var(--font-en);font-weight:600}
.engine-banner{
  margin-top:22px;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:14px 24px;background:rgba(12,18,25,0.7);border:1px solid var(--border);
  border-radius:var(--radius);backdrop-filter:blur(10px);
}
.engine-banner .eb-text{
  font-family:var(--font-din);font-size:28px;font-weight:600;color:var(--ice);
  letter-spacing:0.1em;text-shadow:0 0 20px rgba(56,189,248,0.4);
}
.engine-banner .eb-sub{
  font-family:var(--font-en);font-size:9px;letter-spacing:0.2em;color:var(--text-faint);
  text-transform:uppercase;margin-top:2px;
}

/* ===== 流浪地球2风格倒计时 ===== */
.we-countdown{
  display:flex;align-items:stretch;gap:6px;
}
.we-cd-cell{
  background:linear-gradient(180deg,#0f1720,#0a0f16);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:10px 14px 8px;text-align:center;min-width:64px;position:relative;overflow:hidden;
}
.we-cd-cell::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:0.6;
}
.we-cd-cell::after{
  content:'';position:absolute;top:50%;left:0;right:0;height:1px;
  background:rgba(56,189,248,0.08);
}
.we-cd-num{
  font-family:var(--font-din);font-size:38px;font-weight:600;line-height:1;
  color:var(--ice-bright);text-shadow:0 0 16px rgba(56,189,248,0.5);
  letter-spacing:0.02em;
}
.we-cd-label{
  font-family:var(--font-en);font-size:9px;letter-spacing:0.2em;color:var(--text-faint);
  text-transform:uppercase;margin-top:5px;
}
.we-cd-sep{
  font-family:var(--font-din);font-size:32px;color:var(--text-faint);align-self:center;
  animation:sepBlink 1s step-end infinite;
}
@keyframes sepBlink{0%,100%{opacity:1}50%{opacity:0.2}}
.we-cd-cell.urgent .we-cd-num{color:var(--amber-bright);text-shadow:0 0 16px rgba(249,115,22,0.5)}
.we-cd-cell.urgent::before{background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.we-cd-cell.critical{animation:criticalPulse 1s ease-in-out infinite}
@keyframes criticalPulse{0%,100%{border-color:rgba(239,68,68,0.4)}50%{border-color:rgba(239,68,68,0.8)}}
.we-cd-cell.critical .we-cd-num{color:#fca5a5;text-shadow:0 0 16px rgba(239,68,68,0.6)}

/* ===== 应用布局 ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:240px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-1),var(--bg-0));
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:20;
}
.brand{
  display:flex;align-items:center;gap:12px;padding:20px 20px 18px;
  border-bottom:1px solid var(--border);
}
.brand img{height:36px;max-width:170px;display:block;filter:drop-shadow(0 0 8px rgba(56,189,248,0.2))}
.nav{flex:1;padding:12px 12px;overflow-y:auto}
.nav-group{
  font-family:var(--font-en);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--text-faint);padding:12px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text-muted);font-size:13.5px;transition:all 0.18s;margin-bottom:1px;
  border-left:2px solid transparent;cursor:pointer;
}
.nav-item:hover{color:var(--text);background:rgba(56,189,248,0.05)}
.nav-item.active{
  color:var(--ice-bright);background:rgba(56,189,248,0.08);
  border-left-color:var(--ice);
}
.nav-item .nav-ico{width:16px;text-align:center;flex-shrink:0;font-size:14px;opacity:0.8}
.sidebar-foot{
  padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;
}
.avatar-img{
  width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:2px solid rgba(56,189,248,0.4);
}
.sidebar-foot .who .org-en{
  font-family:var(--font-en);font-size:8px;letter-spacing:0.2em;color:var(--ice);text-transform:uppercase;
}
.sidebar-foot .who .name{font-size:12.5px;font-weight:600;color:var(--text)}
.sidebar-foot .who .role{font-size:10.5px;color:var(--text-muted);margin-top:1px}
.logout-btn{
  margin-left:auto;background:transparent;border:1px solid var(--border-strong);
  color:var(--text-muted);padding:6px 9px;border-radius:var(--radius-sm);cursor:pointer;
  transition:all 0.15s;font-size:12px;
}
.logout-btn:hover{color:var(--red);border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.08)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 30px;border-bottom:1px solid var(--border);
  background:rgba(17,24,32,0.7);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:10;
}
.topbar .page-crumb{
  font-family:var(--font-en);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:3px;
}
.topbar .page-title{
  font-family:var(--font-zh);font-size:22px;font-weight:700;letter-spacing:0.02em;color:var(--text);
}
.topbar-right{display:flex;align-items:center;gap:18px}
.clock{text-align:right}
.clock .time{
  font-family:var(--font-din);font-size:20px;font-weight:600;color:var(--ice-bright);line-height:1.1;
  text-shadow:0 0 10px rgba(56,189,248,0.3);
}
.clock .dt{font-family:var(--font-en);font-size:10px;letter-spacing:0.1em;color:var(--text-faint)}
.content{padding:26px 30px;flex:1}
.footer{
  padding:14px 30px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;
  font-family:var(--font-en);font-size:10px;letter-spacing:0.1em;color:var(--text-faint);
}

/* ===== 卡片与组件 ===== */
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow-soft);position:relative;backdrop-filter:blur(10px);
}
.panel.hl{
  border-color:rgba(56,189,248,0.3);
  background:linear-gradient(160deg,rgba(22,30,40,0.9),var(--surface));
}
.panel-title{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.panel-title h3{font-family:var(--font-zh);font-size:15px;font-weight:700;color:var(--text)}
.panel-title .bar{
  width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--ice),var(--ice-dim));
}
.panel-title .sub{
  font-family:var(--font-en);font-size:10px;letter-spacing:0.12em;color:var(--text-faint);text-transform:uppercase;
}
.panel-title .act{margin-left:auto;display:flex;align-items:center;gap:8px}

.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.section-gap{height:16px}

.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;
  transition:transform 0.25s,border-color 0.25s;
}
.stat-card:hover{transform:translateY(-2px);border-color:rgba(56,189,248,0.3)}
.stat-card::after{
  content:'';position:absolute;top:0;left:20px;right:20px;height:2px;
  background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:0.6;
}
.stat-card .label{
  font-family:var(--font-en);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-faint);
}
.stat-card .value{
  font-family:var(--font-din);font-weight:600;font-size:30px;line-height:1.1;
  color:var(--ice-bright);margin:6px 0 3px;text-shadow:0 0 14px rgba(56,189,248,0.25);
}
.stat-card .sub{font-size:11.5px;color:var(--text-muted)}
.trend{font-family:var(--font-en);font-size:11px;margin-left:6px}
.trend.up{color:var(--green)}.trend.down{color:var(--red)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data thead th{
  font-family:var(--font-en);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-faint);text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);
  background:rgba(56,189,248,0.03);white-space:nowrap;
}
table.data tbody td{padding:11px 14px;border-bottom:1px solid rgba(56,189,248,0.05);vertical-align:middle}
table.data tbody tr:hover{background:rgba(56,189,248,0.03)}
table.data tbody tr:last-child td{border-bottom:none}

.badge{
  font-family:var(--font-en);font-size:10px;padding:2px 10px;border-radius:999px;
  border:1px solid;white-space:nowrap;letter-spacing:0.03em;
}
.badge.ice{color:var(--ice-bright);border-color:rgba(56,189,248,0.4);background:rgba(56,189,248,0.08)}
.badge.amber{color:var(--amber-bright);border-color:rgba(249,115,22,0.4);background:rgba(249,115,22,0.08)}
.badge.green{color:var(--green);border-color:rgba(34,197,94,0.4);background:rgba(34,197,94,0.08)}
.badge.red{color:var(--red);border-color:rgba(239,68,68,0.45);background:rgba(239,68,68,0.08)}
.badge.gray{color:var(--text-muted);border-color:var(--border-strong);background:rgba(255,255,255,0.03)}

.progress{
  height:6px;border-radius:999px;background:rgba(56,189,248,0.08);overflow:hidden;min-width:60px;
}
.progress>div{
  height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ice-dim),var(--ice));
  transition:width .6s ease;
}
.progress.amber>div{background:linear-gradient(90deg,var(--amber-dim),var(--amber))}
.progress.red>div{background:linear-gradient(90deg,#b91c1c,var(--red))}

.metric-row{
  display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(56,189,248,0.05);
}
.metric-row:last-child{border-bottom:none}
.metric-row .m-label{flex:1;font-size:13px;color:var(--text-muted)}
.metric-row .m-val{font-family:var(--font-din);font-size:17px;font-weight:600;color:var(--ice-bright)}
.metric-row .m-unit{font-family:var(--font-en);font-size:11px;color:var(--text-faint);margin-left:3px}
.metric-row .m-note{font-size:10.5px;color:var(--text-faint);margin-left:6px}

/* Hero 面板 */
.hero-panel{
  border-radius:var(--radius-lg);padding:28px 30px;margin-bottom:20px;position:relative;overflow:hidden;
  background:linear-gradient(110deg,rgba(12,18,25,0.94) 25%,rgba(12,18,25,0.75) 60%,rgba(12,18,25,0.6)),
             url('/img/bg-shanghai-engine.jpg') center/cover no-repeat;
  border:1px solid rgba(56,189,248,0.25);box-shadow:var(--shadow-card);
}
.hero-tag{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-en);font-size:10px;
  letter-spacing:0.22em;color:var(--amber);text-transform:uppercase;margin-bottom:6px;
}
.hero-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.hero-title{font-size:19px;font-weight:700;margin-bottom:5px;color:var(--text)}
.hero-desc{font-size:12.5px;color:var(--text-muted);max-width:420px;line-height:1.8}

/* 发展规划展区 */
.plan-section{
  background:linear-gradient(150deg,#f1f3f5,#e2e8f0);border-radius:var(--radius);
  padding:24px 24px 20px;color:#1e293b;box-shadow:var(--shadow-card);
}
.plan-section .ps-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.plan-section .ps-head h3{font-family:var(--font-zh);font-size:16px;font-weight:700;color:#0f172a}
.plan-section .ps-head .en{font-family:var(--font-en);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#64748b}
.plan-section .bar{width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--ice),var(--ice-dim))}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan-item{
  background:#fff;border-radius:var(--radius-sm);overflow:hidden;border:1px solid #cbd5e1;
  box-shadow:0 4px 16px -8px rgba(0,0,0,0.2);transition:transform 0.25s,box-shadow 0.25s;
}
.plan-item:hover{transform:translateY(-3px);box-shadow:0 10px 28px -10px rgba(0,0,0,0.3)}
.plan-item img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:#0f172a}
.plan-item .ti{padding:10px 12px;font-family:var(--font-zh);font-size:13px;font-weight:600;color:#1e293b;border-top:1px solid #e2e8f0}

.notice-item{
  display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(56,189,248,0.05);
  cursor:pointer;transition:padding-left 0.2s;
}
.notice-item:hover{padding-left:5px}
.notice-item:last-child{border-bottom:none}
.notice-item .n-time{font-family:var(--font-en);font-size:11px;color:var(--text-faint);width:52px;flex-shrink:0}
.notice-item .n-text{flex:1;font-size:12.5px;color:var(--text-muted)}

.terminal-box{
  background:rgba(0,0,0,0.5);border-radius:var(--radius-sm);padding:14px;
  font-family:var(--font-en);font-size:11.5px;line-height:1.9;max-height:380px;overflow-y:auto;
  border:1px solid rgba(56,189,248,0.1);
}
.terminal-box .t-line{color:var(--text-muted)}
.terminal-box .t-time{color:var(--text-faint);margin-right:6px}
.terminal-box .t-info{color:var(--ice)}
.terminal-box .t-warn{color:var(--amber)}
.terminal-box .t-ok{color:var(--green)}
.terminal-box .t-err{color:var(--red)}

.page{display:none;animation:fadeIn 0.35s ease}
.page.active{display:block}
@keyframes fadeIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

.menu-toggle{display:none;background:transparent;border:1px solid var(--border-strong);color:var(--text);border-radius:var(--radius-sm);padding:5px 9px;cursor:pointer;font-size:15px}
.sidebar-backdrop{display:none}

@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){.grid-2{grid-template-columns:1fr}.plan-grid{grid-template-columns:1fr}.we-cd-num{font-size:30px}.we-cd-cell{min-width:52px;padding:8px 10px}}
@media(max-width:900px){

  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(5,10,15,0.6);z-index:99}

// ===== 流浪地球2风格倒计时渲染 =====
function renderCountdown(){
  let diff=Math.max(0,cdTarget-Date.now());
  const d=Math.floor(diff/86400000);diff%=86400000;
  const h=Math.floor(diff/3600000);diff%=3600000;
  const m=Math.floor(diff/60000);diff%=60000;
  const s=Math.floor(diff/1000);
  const urgent=d<=1;
  const critical=d===0&&h<6;
  const cls=urgent?(critical?'critical':'urgent'):'';
  return `<div class="we-countdown">
    <div class="we-cd-cell ${cls}"><div class="we-cd-num">${String(d).padStart(2,'0')}</div><div class="we-cd-label">Days</div></div>
    <div class="we-cd-sep">:</div>
    <div class="we-cd-cell ${cls}"><div class="we-cd-num">${String(h).padStart(2,'0')}</div><div class="we-cd-label">Hours</div></div>
    <div class="we-cd-sep">:</div>
    <div class="we-cd-cell ${cls}"><div class="we-cd-num">${String(m).padStart(2,'0')}</div><div class="we-cd-label">Min</div></div>
    <div class="we-cd-sep">:</div>
    <div class="we-cd-cell ${cls}"><div class="we-cd-num">${String(s).padStart(2,'0')}</div><div class="we-cd-label">Sec</div></div>
  </div>`;
}

// ===== 逻辑 =====
let currentPage='overview';
let startTime=Date.now();
let terminalInterval=null;
let countdownInterval=null;

function mount(html){document.getElementById('root').innerHTML=html}

function showLogin(){
  mount(renderLogin());
  const form=document.getElementById('loginForm');
  const err=document.getElementById('loginError');
  document.getElementById('togglePw').addEventListener('click',function(){
    const pw=document.getElementById('password');
    if(pw.type==='password'){pw.type='text';this.textContent='隐藏'}else{pw.type='password';this.textContent='显示'}
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    const u=document.getElementById('username').value.trim();
    const p=document.getElementById('password').value;
    if(u==='xzd1314'&&p==='123456'){err.style.display='none';showApp()}
    else{err.textContent='⚠ 识别码或身份密钥错误';err.style.display='block'}
  });
}

function showApp(){
  currentPage='overview';
  mount(renderApp(currentPage));
  bindAppEvents();startClock();startCountdown();
  if(currentPage==='terminal')startTerminal();
}

function bindAppEvents(){
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',function(){
      const page=this.dataset.page;
      if(page===currentPage)return;
      currentPage=page;
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      this.classList.add('active');
      document.querySelector('.page-crumb').textContent='UEG / '+page;
      document.querySelector('.page-title').textContent=PAGE_TITLES[page]||page;
      document.getElementById('pageContent').innerHTML=renderPage(page);
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('show');
      if(page==='terminal')startTerminal();else if(terminalInterval){clearInterval(terminalInterval);terminalInterval=null}
      if(page==='overview')startCountdown();else if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null}
    });
  });
  document.getElementById('logoutBtn').addEventListener('click',()=>{
    if(terminalInterval){clearInterval(terminalInterval);terminalInterval=null}
    if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null}
    showLogin();
  });
  const mt=document.getElementById('menuToggle');
  if(mt)mt.addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click',function(){
    document.getElementById('sidebar').classList.remove('open');this.classList.remove('show');
  });
}

function startClock(){
  function tick(){
    const now=new Date();
    const t=document.getElementById('clockTime');const d=document.getElementById('clockDate');
    if(t)t.textContent=now.toTimeString().slice(0,8);
    if(d)d.textContent=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
    const up=document.getElementById('uptime');
    if(up){const diff=Math.floor((Date.now()-startTime)/1000);up.textContent=Math.floor(diff/86400)+'天 '+Math.floor((diff%86400)/3600)+'时 '+Math.floor((diff%3600)/60)+'分'}
  }
  tick();setInterval(tick,1000);
}

function startCountdown(){
  if(countdownInterval)clearInterval(countdownInterval);
  function tick(){
    const el=document.getElementById('countdownWrap');
    if(el)el.innerHTML=renderCountdown();
  }
  tick();countdownInterval=setInterval(tick,1000);
}

window.setCd=function(days,hrs){
  cdTarget=Date.now()+((days*24+hrs)*3600+120)*1000;
  try{localStorage.setItem(CD_KEY,String(cdTarget))}catch(e){}
  const el=document.getElementById('countdownWrap');
  if(el)el.innerHTML=renderCountdown();
};

const TERMINAL_LINES=[
  {t:'info',m:'550W 量子核心自检完成'},
  {t:'ok',m:'全球发动机网络同步成功'},
  {t:'info',m:'北京三号发动机功率上调至 92%'},
  {t:'warn',m:'乌鲁木齐发动机温度偏高，建议检修'},
  {t:'info',m:'领航员号空间站通信链路正常'},
  {t:'ok',m:'地下城三号氧气循环系统检测通过'},
  {t:'info',m:'地球航向校准完成，偏差 0.003°'},
  {t:'warn',m:'苏拉威西发动机维护请求已受理'},
  {t:'info',m:'人口统计数据更新：155亿'},
  {t:'ok',m:'行政总署加密通道建立'},
  {t:'info',m:'月球残骸监测系统在线'},
  {t:'info',m:'小行星带穿越规划 v2.1 已加载'},
];
let termIdx=0;
function startTerminal(){
  const box=document.getElementById('terminalBox');
  if(!box)return;
  if(terminalInterval)clearInterval(terminalInterval);
  box.innerHTML='';
  function add(){
    const line=TERMINAL_LINES[termIdx%TERMINAL_LINES.length];
    const now=new Date();
    const cls=line.t==='info'?'t-info':line.t==='warn'?'t-warn':line.t==='err'?'t-err':'t-ok';
    const div=document.createElement('div');div.className='t-line';
    div.innerHTML=`<span class="t-time">[${now.toTimeString().slice(0,8)}]</span><span class="${cls}">${line.m}</span>`;
    box.appendChild(div);box.scrollTop=box.scrollHeight;
    while(box.children.length>40)box.removeChild(box.firstChild);
    termIdx++;
  }
  for(let i=0;i<5;i++)add();
  terminalInterval=setInterval(add,2200);
}

showLogin();
