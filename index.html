<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a151f">
<title>UEG 行政管理中心 | 地球联合政府 · 行政总署</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
/* ===== 自定义字体 ===== */
@font-face{font-family:'UEG-Body';src:url('/fonts/zhonghei.ttf') format('truetype');font-weight:400 700;font-display:swap}
@font-face{font-family:'Rajdhani';src:url('/fonts/rajdhani-medium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'DIN';src:url('/fonts/din-mittelschrift.otf') format('opentype');font-weight:500;font-display:swap}

:root{
  --bg-0:#0a151f;--bg-1:#0e2031;--bg-2:#12293c;
  --surface:rgba(20,43,62,0.72);--surface-solid:#142b3e;--surface-2:#1a3550;
  --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.14);
  --text:#eef1f4;--text-muted:rgba(238,241,244,0.62);--text-faint:rgba(238,241,244,0.42);
  --gold:#d4ba8a;--gold-bright:#e6cf9f;--gold-dark:#b3975f;
  --blue:#8fc3e0;--green:#8ed3a6;--red:#e08a8a;
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --shadow-card:0 18px 44px -24px rgba(0,0,0,0.7);
  --shadow-soft:0 10px 30px -20px rgba(0,0,0,0.6);
  --font-zh:'UEG-Body','Microsoft YaHei','PingFang SC',sans-serif;
  --font-en:'Rajdhani','UEG-Body',sans-serif;
  --font-din:'DIN','Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:radial-gradient(1200px 600px at 70% -10%,rgba(42,78,108,0.45),transparent 60%),
             linear-gradient(180deg,var(--bg-0),var(--bg-1) 60%,var(--bg-0));
  background-color:var(--bg-0);
  color:var(--text);font-family:var(--font-zh);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh}
::selection{background:rgba(212,186,138,0.3);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22)}
.mono{font-family:var(--font-en)}
.muted{color:var(--text-muted)}
.small{font-size:12px}

/* ===== 登录页 ===== */
.login-wrap{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;position:relative;
  background:radial-gradient(900px 520px at 20% -10%,rgba(46,86,116,0.5),transparent 60%),
             radial-gradient(700px 500px at 90% 110%,rgba(31,48,66,0.5),transparent 60%),
             linear-gradient(160deg,var(--bg-0),var(--bg-1) 55%,#0a1824);
}
.bg-photo{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-size:cover;background-position:center;
  background-image:url('/img/bg-qq1.webp');
}
.bg-photo::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,21,31,0.82),rgba(10,21,31,0.55) 45%,rgba(10,21,31,0.9));
}
.login-wrap>*:not(.bg-photo){position:relative;z-index:1}
.login-header{
  margin-bottom:28px;text-align:center;color:var(--text-muted);
  font-family:var(--font-en);letter-spacing:0.24em;font-size:11px;text-transform:uppercase;
}
.login-card{
  width:100%;max-width:420px;background:rgba(15,33,51,0.72);
  border:1px solid var(--border-strong);border-radius:18px;padding:38px 36px;
  box-shadow:var(--shadow-card);backdrop-filter:blur(16px);
  position:relative;overflow:hidden;
  animation:cardIn 0.7s cubic-bezier(0.22,1,0.36,1);
}
@keyframes cardIn{0%{opacity:0;transform:translateY(20px) scale(0.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
.login-card::before{
  content:'';position:absolute;top:0;left:10%;right:10%;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.login-head{text-align:center;margin-bottom:10px}
.login-head .ueg-logo{height:110px;mix-blend-mode:screen;filter:brightness(1.08);display:block;margin:0 auto 6px}
.login-head h1{
  font-family:var(--font-zh);font-size:28px;font-weight:700;letter-spacing:0.12em;color:#fff;
  margin-top:4px;
}
.login-head .sub{
  font-family:var(--font-en);font-size:12px;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--gold);margin-top:8px;
}
.officer-row{
  display:flex;flex-direction:column;align-items:center;margin-top:18px;
}
.officer-avatar{
  width:68px;height:68px;border-radius:50%;border:2px solid rgba(212,186,138,0.55);
  padding:3px;box-shadow:0 10px 30px -12px rgba(0,0,0,0.7);background:rgba(255,255,255,0.04);
  object-fit:cover;
}
.officer-name{margin-top:10px;font-size:15px;font-weight:600;color:var(--text)}
.officer-tag{
  font-family:var(--font-en);font-size:11px;letter-spacing:0.16em;color:var(--gold);
  margin-top:3px;text-transform:uppercase;
}
.login-sep{height:1px;background:linear-gradient(90deg,transparent,var(--border-strong),transparent);margin:4px 0 24px}
.login-error{
  background:rgba(224,138,138,0.08);border:1px solid rgba(224,138,138,0.4);color:#f0b9b9;
  font-size:12.5px;padding:11px 13px;border-radius:10px;margin-bottom:16px;
  animation:shake 0.4s;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.field{margin-bottom:18px}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:7px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;background:rgba(10,26,40,0.6);border:1px solid var(--border-strong);
  color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;font-family:var(--font-zh);
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,186,138,0.14)}
.field input::placeholder{color:var(--text-faint)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(212,186,138,0.1);border:1px solid rgba(212,186,138,0.4);
  color:var(--gold-bright);font-size:13.5px;padding:9px 18px;border-radius:10px;
  cursor:pointer;font-family:var(--font-zh);transition:all 0.2s;font-weight:500;
}
.btn:hover{background:rgba(212,186,138,0.18);border-color:rgba(212,186,138,0.6)}
.btn.primary{
  background:linear-gradient(135deg,var(--gold-bright),var(--gold-dark));color:#1a1205;
  font-weight:700;border-color:transparent;box-shadow:0 8px 24px -10px rgba(212,186,138,0.5);
}
.btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text-muted)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-bright)}
.btn.sm{padding:6px 13px;font-size:12.5px}
.login-btn{width:100%;justify-content:center;padding:13px;font-size:15px;letter-spacing:0.14em;margin-top:6px}
.login-foot{
  text-align:center;font-family:var(--font-en);font-size:10px;letter-spacing:0.16em;
  color:var(--text-faint);margin-top:26px;text-transform:uppercase;
}
.login-tip{
  margin-top:22px;font-size:12px;color:var(--text-muted);text-align:center;line-height:1.9;
  border:1px dashed var(--border-strong);border-radius:12px;padding:12px;background:rgba(255,255,255,0.015);
}
.login-tip b{color:var(--gold-bright);font-family:var(--font-en);font-weight:600}
.u550-wrap{
  margin-top:26px;background:linear-gradient(120deg,#09141d,#0d1c2a);
  border:1px solid var(--border-strong);border-radius:14px;padding:18px 30px;
  display:flex;align-items:center;justify-content:center;
}
.u550-wrap img{height:52px;mix-blend-mode:screen;filter:brightness(1.1)}

/* ===== 应用布局 ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:256px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-1),var(--bg-0));
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:20;
}
.brand{display:flex;align-items:center;gap:13px;padding:22px 22px 20px;border-bottom:1px solid var(--border)}
.brand img{height:40px;max-width:190px;mix-blend-mode:screen;display:block}
.nav{flex:1;padding:14px 14px;overflow-y:auto}
.nav-group{
  font-family:var(--font-en);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--text-faint);padding:14px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:10px;
  color:var(--text-muted);text-decoration:none;font-size:14px;
  transition:background 0.2s,color 0.2s;margin-bottom:2px;border:1px solid transparent;
  cursor:pointer;
}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-item.active{
  color:var(--gold-bright);background:linear-gradient(90deg,rgba(212,186,138,0.13),rgba(212,186,138,0.02));
  border-color:rgba(212,186,138,0.22);
}
.nav-item .nav-ico{width:18px;text-align:center;flex-shrink:0;font-size:15px;opacity:0.85}
.sidebar-foot{
  padding:16px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;
}
.avatar-img{
  width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:2px solid rgba(212,186,138,0.5);
}
.sidebar-foot .who .org-en{font-family:var(--font-en);font-size:9px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase}
.sidebar-foot .who .name{font-size:13px;font-weight:600;color:var(--text)}
.sidebar-foot .who .role{font-size:11px;color:var(--text-muted);margin-top:1px}
.logout-btn{
  margin-left:auto;background:transparent;border:1px solid var(--border-strong);
  color:var(--text-muted);padding:7px 10px;border-radius:9px;cursor:pointer;transition:all 0.15s;
  font-size:13px;
}
.logout-btn:hover{color:var(--red);border-color:rgba(224,138,138,0.5);background:rgba(224,138,138,0.08)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 34px;border-bottom:1px solid var(--border);
  background:rgba(14,32,49,0.6);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:10;
}
.topbar .page-crumb{font-family:var(--font-en);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
.topbar .page-title{
  font-family:var(--font-zh);font-size:24px;font-weight:700;letter-spacing:0.02em;
  background:linear-gradient(180deg,#fff,#c9d6e2);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.topbar-right{display:flex;align-items:center;gap:20px}
.clock{text-align:right}
.clock .time{font-family:var(--font-en);font-size:22px;font-weight:600;color:var(--gold-bright);line-height:1.1}
.clock .dt{font-family:var(--font-en);font-size:11px;letter-spacing:0.1em;color:var(--text-faint)}
.content{padding:30px 34px;flex:1}
.footer{
  padding:18px 34px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;
  font-family:var(--font-en);font-size:11px;letter-spacing:0.1em;color:var(--text-faint);
}

/* ===== 卡片与组件 ===== */
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow-card);position:relative;
  backdrop-filter:blur(8px);
}
.panel.hl{
  border-color:rgba(212,186,138,0.3);
  background:linear-gradient(160deg,rgba(24,50,72,0.8),var(--surface));
}
.panel-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.panel-title h3{font-family:var(--font-zh);font-size:16px;font-weight:700;color:var(--text)}
.panel-title .bar{width:4px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--gold-bright),var(--gold-dark))}
.panel-title .sub{font-family:var(--font-en);font-size:11px;letter-spacing:0.12em;color:var(--text-faint);text-transform:uppercase}
.panel-title .act{margin-left:auto;display:flex;align-items:center;gap:10px}

.grid{display:grid;gap:20px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.section-gap{height:20px}

.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 22px 20px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;
  transition:transform 0.3s,border-color 0.3s;
}
.stat-card:hover{transform:translateY(-2px);border-color:rgba(212,186,138,0.25)}
.stat-card::after{
  content:'';position:absolute;top:0;left:24px;right:24px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0.7;
}
.stat-card .label{font-family:var(--font-en);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-faint)}
.stat-card .value{
  font-family:var(--font-en);font-weight:700;font-size:34px;line-height:1.1;
  color:var(--gold-bright);margin:8px 0 4px;text-shadow:0 2px 20px rgba(212,186,138,0.18);
}
.stat-card .sub{font-size:12px;color:var(--text-muted)}
.trend{font-family:var(--font-en);font-size:12px;margin-left:8px}
.trend.up{color:var(--green)}.trend.down{color:var(--red)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data thead th{
  font-family:var(--font-en);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-faint);text-align:left;padding:13px 16px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.02);white-space:nowrap;
}
table.data tbody td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:middle}
table.data tbody tr:hover{background:rgba(255,255,255,0.02)}
table.data tbody tr:last-child td{border-bottom:none}

.badge{
  font-family:var(--font-en);font-size:11px;padding:3px 11px;border-radius:999px;
  border:1px solid;white-space:nowrap;letter-spacing:0.03em;
}
.badge.gold{color:var(--gold-bright);border-color:rgba(212,186,138,0.45);background:rgba(212,186,138,0.08)}
.badge.blue{color:var(--blue);border-color:rgba(143,195,224,0.4);background:rgba(143,195,224,0.08)}
.badge.green{color:var(--green);border-color:rgba(142,211,166,0.4);background:rgba(142,211,166,0.08)}
.badge.red{color:var(--red);border-color:rgba(224,138,138,0.45);background:rgba(224,138,138,0.08)}
.badge.gray{color:var(--text-muted);border-color:var(--border-strong);background:rgba(255,255,255,0.03)}

.progress{height:7px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;min-width:80px}
.progress>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold-dark),var(--gold-bright));transition:width .6s ease}
.progress.red>div{background:linear-gradient(90deg,#a05f5f,var(--red))}

.metric-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.metric-row:last-child{border-bottom:none}
.metric-row .m-label{flex:1;font-size:13.5px;color:var(--text-muted)}
.metric-row .m-val{font-family:var(--font-en);font-size:18px;font-weight:600;color:var(--gold-bright)}
.metric-row .m-unit{font-family:var(--font-en);font-size:12px;color:var(--text-faint);margin-left:4px}
.metric-row .m-note{font-size:11px;color:var(--text-faint);margin-left:8px}

.countdown{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.countdown .cd-cell{flex:1;min-width:80px;text-align:center}
.countdown .cd-num{font-family:var(--font-din);font-size:48px;font-weight:600;line-height:1;color:var(--gold-bright);text-shadow:0 3px 26px rgba(212,186,138,0.28)}
.countdown .cd-label{font-family:var(--font-en);font-size:10px;letter-spacing:0.2em;color:var(--text-faint);text-transform:uppercase;margin-top:6px}
.countdown .cd-sep{font-family:var(--font-din);font-size:36px;color:var(--text-faint);align-self:flex-start;margin-top:4px}

.hero-panel{
  border-radius:var(--radius-lg);padding:32px 34px;margin-bottom:22px;position:relative;overflow:hidden;
  background:linear-gradient(110deg,rgba(9,18,28,0.96) 30%,rgba(9,18,28,0.82) 55%,rgba(9,18,28,0.7)),url('/img/bg-qq2.webp') center/cover no-repeat;
  border:1px solid rgba(212,186,138,0.2);box-shadow:var(--shadow-card);
}
.hero-title{font-size:20px;font-weight:700;margin-bottom:6px}
.hero-desc{font-size:13px;color:var(--text-muted);max-width:440px;line-height:1.8}
.hero-tag{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-en);font-size:11px;
  letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;
}

.plan-section{
  background:linear-gradient(150deg,#f7f5f0,#ecece6);border-radius:var(--radius);
  padding:26px 26px 22px;color:#22303c;box-shadow:var(--shadow-card);
}
.plan-section .ps-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.plan-section .ps-head h3{font-family:var(--font-zh);font-size:17px;font-weight:700;color:#1b2733}
.plan-section .ps-head .en{font-family:var(--font-en);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#94a4b0}
.plan-section .bar{width:4px;height:18px;border-radius:3px;background:linear-gradient(180deg,#c9a24b,#8a6d1f)}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan-item{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e3e0d6;box-shadow:0 6px 20px -12px rgba(0,0,0,0.25);transition:transform 0.3s,box-shadow 0.3s}
.plan-item:hover{transform:translateY(-3px);box-shadow:0 12px 30px -12px rgba(0,0,0,0.35)}
.plan-item img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:#fff}
.plan-item .ti{padding:12px 14px;font-family:var(--font-zh);font-size:14px;font-weight:600;color:#1b2733;border-top:1px solid #eee}

.notice-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:padding-left 0.2s}
.notice-item:hover{padding-left:6px}
.notice-item:last-child{border-bottom:none}
.notice-item .n-time{font-family:var(--font-en);font-size:12px;color:var(--text-faint);width:48px;flex-shrink:0}
.notice-item .n-text{flex:1;font-size:13px;color:var(--text-muted)}

.terminal-box{
  background:rgba(0,0,0,0.4);border-radius:var(--radius-sm);padding:16px;
  font-family:var(--font-en);font-size:12px;line-height:1.9;max-height:400px;overflow-y:auto;
  border:1px solid rgba(255,255,255,0.06);
}
.terminal-box .t-line{color:var(--text-muted)}
.terminal-box .t-time{color:var(--text-faint);margin-right:8px}
.terminal-box .t-info{color:var(--blue)}
.terminal-box .t-warn{color:var(--gold)}
.terminal-box .t-ok{color:var(--green)}
.terminal-box .t-err{color:var(--red)}

.page{display:none;animation:fadeIn 0.4s ease}
.page.active{display:block}
@keyframes fadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}

.menu-toggle{display:none;background:transparent;border:1px solid var(--border-strong);color:var(--text);border-radius:9px;padding:6px 10px;cursor:pointer;font-size:16px}
.sidebar-backdrop{display:none}

@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){.grid-2{grid-template-columns:1fr}.plan-grid{grid-template-columns:1fr}}
@media(max-width:900px){
  .menu-toggle{display:inline-flex}

// ===== 应用逻辑 =====
let currentPage='overview';
let startTime=Date.now();
let terminalInterval=null;

function mount(html){
  document.getElementById('root').innerHTML=html;
}

function showLogin(){
  mount(renderLogin());
  const form=document.getElementById('loginForm');
  const err=document.getElementById('loginError');
  document.getElementById('togglePw').addEventListener('click',function(){
    const pw=document.getElementById('password');
    if(pw.type==='password'){pw.type='text';this.textContent='隐藏'}else{pw.type='password';this.textContent='显示'}
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    const u=document.getElementById('username').value.trim();
    const p=document.getElementById('password').value;
    if(u==='xzd1314'&&p==='123456'){
      err.style.display='none';
      showApp();
    }else{
      err.textContent='⚠ 识别码或身份密钥错误';
      err.style.display='block';
    }
  });
}

function showApp(){
  currentPage='overview';
  mount(renderApp(currentPage));
  bindAppEvents();
  startClock();
  startCountdown();
  if(currentPage==='terminal')startTerminal();
}

function bindAppEvents(){
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',function(){
      const page=this.dataset.page;
      if(page===currentPage)return;
      currentPage=page;
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      this.classList.add('active');
      document.querySelector('.page-crumb').textContent='UEG / '+page;
      document.querySelector('.page-title').textContent=PAGE_TITLES[page]||page;
      document.getElementById('pageContent').innerHTML=renderPage(page);
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('show');
      if(page==='terminal')startTerminal();else if(terminalInterval){clearInterval(terminalInterval);terminalInterval=null}
    });
  });
  document.getElementById('logoutBtn').addEventListener('click',()=>{
    if(terminalInterval){clearInterval(terminalInterval);terminalInterval=null}
    showLogin();
  });
  const mt=document.getElementById('menuToggle');
  if(mt)mt.addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click',function(){
    document.getElementById('sidebar').classList.remove('open');
    this.classList.remove('show');
  });
}

function startClock(){
  function tick(){
    const now=new Date();
    const t=document.getElementById('clockTime');
    const d=document.getElementById('clockDate');
    if(t)t.textContent=now.toTimeString().slice(0,8);
    if(d)d.textContent=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
    const up=document.getElementById('uptime');
    if(up){const diff=Math.floor((Date.now()-startTime)/1000);up.textContent=Math.floor(diff/86400)+'天 '+Math.floor((diff%86400)/3600)+'时 '+Math.floor((diff%3600)/60)+'分'}
  }
  tick();setInterval(tick,1000);
}

function startCountdown(){
  function tick(){
    const el=document.getElementById('countdown');
    if(!el)return;
    let diff=Math.max(0,cdTarget-Date.now());
    const d=Math.floor(diff/86400000);diff%=86400000;
    const h=Math.floor(diff/3600000);diff%=3600000;
    const m=Math.floor(diff/60000);diff%=60000;
    const s=Math.floor(diff/1000);
    el.innerHTML=`
      <div class="cd-cell"><div class="cd-num">${String(d).padStart(2,'0')}</div><div class="cd-label">Days</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-cell"><div class="cd-num">${String(h).padStart(2,'0')}</div><div class="cd-label">Hours</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-cell"><div class="cd-num">${String(m).padStart(2,'0')}</div><div class="cd-label">Min</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-cell"><div class="cd-num">${String(s).padStart(2,'0')}</div><div class="cd-label">Sec</div></div>`;
  }
  tick();setInterval(tick,1000);
}

window.setCd=function(days,hrs){
  cdTarget=Date.now()+((days*24+hrs)*3600+120)*1000;
  try{localStorage.setItem(CD_KEY,String(cdTarget))}catch(e){}
};

const TERMINAL_LINES=[
  {t:'info',m:'550W 量子核心自检完成'},
  {t:'ok',m:'全球发动机网络同步成功'},
  {t:'info',m:'北京三号发动机功率上调至 92%'},
  {t:'warn',m:'乌鲁木齐发动机温度偏高，建议检修'},
  {t:'info',m:'领航员号空间站通信链路正常'},
  {t:'ok',m:'地下城三号氧气循环系统检测通过'},
  {t:'info',m:'地球航向校准完成，偏差 0.003°'},
  {t:'warn',m:'苏拉威西发动机维护请求已受理'},
  {t:'info',m:'人口统计数据更新：155亿'},
  {t:'ok',m:'行政总署加密通道建立'},
  {t:'info',m:'月球残骸监测系统在线'},
  {t:'info',m:'小行星带穿越规划 v2.1 已加载'},
];
let termIdx=0;
function startTerminal(){
  const box=document.getElementById('terminalBox');
  if(!box)return;
  if(terminalInterval)clearInterval(terminalInterval);
  box.innerHTML='';
  function add(){
    const line=TERMINAL_LINES[termIdx%TERMINAL_LINES.length];
    const now=new Date();
    const cls=line.t==='info'?'t-info':line.t==='warn'?'t-warn':line.t==='err'?'t-err':'t-ok';
    const div=document.createElement('div');
    div.className='t-line';
    div.innerHTML=`<span class="t-time">[${now.toTimeString().slice(0,8)}]</span><span class="${cls}">${line.m}</span>`;
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
    while(box.children.length>40)box.removeChild(box.firstChild);
    termIdx++;
  }
  for(let i=0;i<5;i++)add();
  terminalInterval=setInterval(add,2200);
}

// ===== 启动 =====
showLogin();
</script>
